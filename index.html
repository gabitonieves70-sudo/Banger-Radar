<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banger Radar</title>
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
:root{
  --bg:#0a0b0f; --s1:#12141b; --s2:#191c25; --s3:#222634; --line:#262b3a; --text:#eef1f7; --dim:#8b93a7; --faint:#5d6578;
  --hot:#ff5a1f; --hot2:#ffb020; --good:#2bd47d; --warn:#ffc53d; --bad:#ff4d6a; --blue:#5aa9ff; --ig1:#f58529; --ig2:#dd2a7b; --ig3:#8134af;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--hot)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(10,11,15,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;height:62px}
.logo{width:34px;height:34px;border-radius:50%;flex:none;position:relative;overflow:hidden;border:1px solid rgba(255,90,31,.5);
  background:radial-gradient(circle,var(--hot) 0 16%,transparent 17%),repeating-radial-gradient(circle,transparent 0 6px,rgba(255,90,31,.3) 6px 7px)}
.logo::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(255,176,32,.6),transparent 28%);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{font-size:18px;letter-spacing:.2px}.brand b span{color:var(--hot)}
.brand small{display:block;color:var(--dim);font-size:11.5px;margin-top:-2px}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pl 1.6s infinite}.dot.off{background:var(--faint);animation:none}
@keyframes pl{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 14px;font-weight:600;font-size:13.5px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:#3a4155}
.btn.primary{background:linear-gradient(135deg,var(--hot),#ff7a3d);border-color:transparent;color:#fff}
.btn.primary:disabled{opacity:.55;cursor:default}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}

/* notice */
.notice{margin:14px 0 0;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid}
.notice.err{background:rgba(255,77,106,.07);border-color:rgba(255,77,106,.3);color:#ffc0cb}
.notice.info{background:rgba(90,169,255,.07);border-color:rgba(90,169,255,.3);color:#cfe4ff}

/* stats strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.st{flex:none;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:118px}
.st b{display:block;font-size:18px}.st span{font-size:11.5px;color:var(--dim)}

/* tabs + filters */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600}
.tab.on{background:var(--text);color:#000;border-color:var(--text)}
.tab i{font-style:normal;opacity:.65;margin-left:4px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;padding-bottom:12px}
@media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.hint{color:var(--dim);font-size:12.5px;padding:2px 0 12px}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-bottom:60px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:#394055;transform:translateY(-1px)}
.card.banger{border-color:rgba(255,90,31,.5);box-shadow:0 10px 30px -18px rgba(255,90,31,.8)}
.thumb{height:150px;position:relative;background:linear-gradient(135deg,#1c1f2b,#141720);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;opacity:.55}
.thumb .plat{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.plat.instagram{background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3))}
.thumb .age{position:absolute;right:10px;top:10px;font-size:11.5px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6)}
.thumb .ring{position:absolute;right:10px;bottom:-24px}
.ring{--p:0;--c:var(--hot);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#2a2f3e 0);box-shadow:0 0 0 4px var(--s1)}
.ring b{width:46px;height:46px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-size:16px}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.tier{font-size:11px;font-weight:800;letter-spacing:.7px}
.pname{font-size:16px;font-weight:700;line-height:1.25;padding-right:62px}
.sub{color:var(--dim);font-size:12.5px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.num{background:var(--s2);border-radius:10px;padding:6px 4px;text-align:center}
.num b{display:block;font-size:13.5px}.num span{font-size:10.5px;color:var(--dim)}
.bar{height:6px;border-radius:5px;background:#2a2f3e;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--s2);border:1px solid var(--line);color:#cdd3e0}
.chip.g{color:var(--good);border-color:rgba(43,212,125,.35);background:rgba(43,212,125,.08)}
.chip.y{color:var(--warn);border-color:rgba(255,197,61,.35);background:rgba(255,197,61,.08)}
.chip.r{color:var(--bad);border-color:rgba(255,77,106,.35);background:rgba(255,77,106,.08)}
.chip.b{color:var(--blue);border-color:rgba(90,169,255,.35);background:rgba(90,169,255,.08)}
.why{font-size:12.5px;color:#ffc0cb}
.cacts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.cacts .btn{flex:1;justify-content:center}
.star.on{color:var(--hot2)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px;background:var(--s1);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .25s;overflow-y:auto}
.drawer.on{transform:none}
.dhead{position:sticky;top:0;background:rgba(10,11,15,.94);backdrop-filter:blur(10px);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:2}
.dbody{padding:16px;display:grid;gap:14px}
.sec{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px}
.sec h4{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.rules{display:grid;gap:6px}
.rule{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.rule span:last-child{color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}
.parts{display:grid;gap:6px;font-size:12.5px}
.parts div{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center}
.pb{height:6px;border-radius:4px;background:#2a2f3e;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--hot2))}
.q{font-size:12.5px;background:var(--s2);border:1px solid var(--line);padding:6px 9px;border-radius:9px}
.vi{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px}
.vi span{color:var(--dim)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#cfd6e4;white-space:pre-wrap;margin-top:5px}
.copy{float:right;font-size:11.5px;font-weight:700;color:#fff;background:var(--hot);border-radius:7px;padding:3px 9px}
.verdict{font-size:13.5px;line-height:1.5}
.links{display:flex;flex-wrap:wrap;gap:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.6)}
.modal.on{display:grid}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:92vh;overflow-y:auto}
.mhead{position:sticky;top:0;background:var(--bg);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.mbody{padding:16px 18px;display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:5px;font-size:12.5px;color:var(--dim)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px}
.tog small{display:block;color:var(--dim);font-size:11.5px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a2f3e;border-radius:99px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--hot)}.sw input:checked+span::after{transform:translateX(18px)}
.cost{font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--s3);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:620px){.pill.status{display:none}.brand small{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="logo"></div>
    <div class="brand"><b>Banger <span>Radar</span></b><small>Instagram-first product finder</small></div>
    <div class="grow"></div>
    <span class="pill status" id="statusPill"><span class="dot off"></span>Loading…</span>
    <button class="btn primary" id="scanBtn">⟳ Scan now</button>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
  </div>
</header>

<main class="wrap">
  <div id="notices"></div>
  <div class="strip" id="strip"></div>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters">
    <input class="search" id="q" placeholder="🔎 Search products, niches, captions, @pages…">
    <select id="fPlat"><option value="all">All platforms</option><option value="instagram">📸 Instagram</option><option value="tiktok">🎵 TikTok</option></select>
    <select id="fNiche"><option value="all">All niches</option></select>
    <select id="fAge"><option value="999">Any time</option><option value="24">Last 24 hrs</option><option value="72">Last 3 days</option><option value="168">Last 7 days</option></select>
    <select id="fSort">
      <option value="score">Sort: Banger %</option><option value="vph">Sort: Views / hour</option><option value="views">Sort: Most views</option>
      <option value="comments">Sort: Most comments</option><option value="intent">Sort: Buy intent</option><option value="new">Sort: Newest</option>
    </select>
  </div>
  <div class="hint" id="hint"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal" id="settingsModal">
  <div class="mbox">
    <div class="mhead"><b style="font-size:17px">⚙️ Settings</b><div class="grow"></div><button class="icon-btn" data-close>✕</button></div>
    <div class="mbody" id="settingsBody">Loading…</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(Math.round(n));
const pct = (x, d=1) => x == null ? '—' : (x*100).toFixed(d).replace(/\.0$/,'') + '%';
const ago = h => h < 1 ? Math.round(h*60)+'m ago' : h < 48 ? Math.round(h)+'h ago' : Math.round(h/24)+'d ago';
const sinceIso = iso => ago((Date.now() - new Date(iso)) / 36e5);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const NICHE_EMOJI = { Dogs:'🐶', Cats:'🐱', Pets:'🐾', Baby:'🍼', Kids:'🧸', Car:'🚗', Kitchen:'🍳', Home:'🏠', Beauty:'💄', Fitness:'💪', Faith:'✝️', Holiday:'🎄', Gadgets:'🔌', Outdoors:'🏕️', Fashion:'👗' };
const TIERS = { banger:['🔥 BANGER','var(--hot)'], test:['🧪 WORTH TESTING','var(--warn)'], close:['👀 CLOSE CALL','var(--blue)'], out:['❌ FILTERED','var(--bad)'] };
const PARTS = { buyIntent:'Buy intent', engagement:'Engagement', velocity:'Velocity', productFit:'Product fit', saturation:'Low saturation', margin:'Margin' };

let D = { videos: [], ads: [], status: {}, settings: null, weights: {} };
let view = null, saved = store.get('br_saved', {}), pin = store.get('br_pin', ''), poll = null;

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2800); }

const VIEWS = {
  banger: ['🔥 Bangers', v => v.tier === 'banger'],
  test:   ['🧪 Worth testing', v => v.tier === 'test'],
  close:  ['👀 Close calls', v => v.tier === 'close'],
  ads:    ['📢 Ads running', null],
  saved:  ['⭐ Saved', v => !!saved[v.id]],
  all:    ['📋 Everything', () => true]
};

// ---------- load ----------
async function load() {
  try {
    D = await fetch('/api/data').then(r => r.json());
  } catch { $('#grid').innerHTML = '<div class="empty"><b>Couldn’t load data</b>Refresh the page.</div>'; return; }
  for (const v of D.videos) if (saved[v.id]) saved[v.id] = v;   // refresh saved snapshots
  store.set('br_saved', saved);
  if (!view) {
    const c = k => D.videos.filter(VIEWS[k][1]).length;
    view = c('banger') ? 'banger' : c('test') ? 'test' : c('close') ? 'close' : D.ads.length ? 'ads' : 'all';
  }
  const niches = [...new Set(D.videos.map(v => v.niche?.[0]).filter(Boolean))].sort();
  const cur = $('#fNiche').value;
  $('#fNiche').innerHTML = '<option value="all">All niches</option>' + niches.map(n => `<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
  header(); render();
  clearTimeout(poll);
  if (D.status.scanning) poll = setTimeout(load, 15000);
}

function header() {
  const st = D.status || {}, s = st.stats || {};
  $('#statusPill').innerHTML = st.scanning ? `<span class="dot"></span>Scanning… started ${sinceIso(st.scanStartedAt)}`
    : st.lastScanAt ? `<span class="dot"></span>Last scan ${sinceIso(st.lastScanAt)}` : `<span class="dot off"></span>No scan yet`;
  $('#scanBtn').disabled = !!st.scanning;
  $('#scanBtn').textContent = st.scanning ? 'Scanning…' : '⟳ Scan now';

  const notes = [];
  if (!st.connected) notes.push(['err', 'Apify isn’t connected. Add APIFY_TOKEN in Railway.']);
  if (st.error) notes.push(['err', '⚠️ ' + st.error]);
  if (st.scanning) notes.push(['info', '📡 Scanning Instagram' + (D.settings?.sources?.facebookAds ? ' + Facebook ads' : '') + '… takes 3–10 minutes. This page updates by itself.']);
  if (!st.lastScanAt && !st.scanning) notes.push(['info', 'No results yet with the new Instagram-first setup. Tap <b>Scan now</b> to run the first scan.']);
  $('#notices').innerHTML = notes.map(([c, m]) => `<div class="notice ${c}">${m}</div>`).join('');

  const tiers = k => D.videos.filter(v => v.tier === k).length;
  $('#strip').innerHTML = [
    ['📸 ' + fmt(s.instagram ?? 0), 'Instagram reels found'],
    ['📢 ' + fmt(s.adProducts ?? 0), 'Product ads (FB/IG)'],
    ['🛍️ ' + fmt(s.products ?? 0), 'Real products'],
    ['🔥 ' + tiers('banger'), 'Bangers'],
    ['🧪 ' + tiers('test'), 'Worth testing'],
    ['🤖 ' + fmt(s.deepChecked ?? 0), 'Deep-checked by Claude'],
    ...(st.nextScanAt ? [['⏰ ' + nextIn(st.nextScanAt), 'Next auto-scan']] : [])
  ].map(([b, t]) => `<div class="st"><b>${b}</b><span>${t}</span></div>`).join('');
}
const nextIn = iso => { const h = (new Date(iso) - Date.now()) / 36e5; return h <= 0 ? 'soon' : h < 1 ? Math.round(h*60)+'m' : Math.round(h)+'h'; };

// ---------- render ----------
function render() {
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([k, [label, f]]) => {
    const n = k === 'ads' ? D.ads.length : D.videos.filter(f).length;
    return `<button class="tab ${view===k?'on':''}" data-v="${k}">${label}<i>${n}</i></button>`;
  }).join('');
  $('#filters').style.display = view === 'ads' ? 'none' : '';
  if (view === 'ads') return renderAds();

  const q = $('#q').value.trim().toLowerCase(), plat = $('#fPlat').value, niche = $('#fNiche').value, maxH = +$('#fAge').value;
  let list = D.videos.filter(VIEWS[view][1]).filter(v =>
    (plat === 'all' || v.platform === plat) && (niche === 'all' || v.niche?.[0] === niche) && v.stats.hours <= maxH &&
    (!q || [v.product, v.caption, v.handle, v.niche?.join(' '), v.query, v.audience?.who].join(' ').toLowerCase().includes(q)));
  const by = { score:(a,b)=>b.score-a.score, vph:(a,b)=>b.stats.viewsPerHour-a.stats.viewsPerHour, views:(a,b)=>b.views-a.views,
    comments:(a,b)=>b.comments-a.comments, intent:(a,b)=>(b.comments_breakdown.buyIntent??-1)-(a.comments_breakdown.buyIntent??-1), new:(a,b)=>a.stats.hours-b.stats.hours }[$('#fSort').value];
  list.sort(by);

  const S = D.settings || {};
  $('#hint').innerHTML = {
    banger: `Passed every rule <b>and</b> scored 75%+. Rules: posted ≤ ${S.maxAgeDays}d, ${fmt(S.minViews)}+ views, ${S.minComments}+ comments, ${S.minLikeRatePct}%+ like rate, real product, ${S.minUsPct}%+ US, not saturated.`,
    test: 'Passed every rule but scored under 75%. Still worth a look.',
    close: 'Failed exactly one rule. The red line on each card says which.',
    saved: 'Products you starred (saved on this device).',
    all: 'Every product reel from the latest scan, best first.'
  }[view] + ` Showing <b>${list.length}</b>.`;

  $('#grid').innerHTML = list.length ? list.map(card).join('') : emptyState();
}

function emptyState() {
  const m = {
    banger: ['No bangers in this scan yet', D.videos.some(v => v.tier==='test'||v.tier==='close') ? 'Check <b>🧪 Worth testing</b> and <b>👀 Close calls</b>.' : 'Run a scan or loosen the rules in ⚙️ Settings.'],
    test: ['Nothing here right now', 'Check the other tabs or run a new scan.'],
    close: ['No close calls', 'Nothing missed by just one rule this time.'],
    saved: ['No saved products yet', 'Tap ☆ on any product to save it here.'],
    all: ['No products yet', 'Tap <b>Scan now</b> to search Instagram.']
  }[view];
  return `<div class="empty"><b>${m[0]}</b>${m[1]}</div>`;
}

function thumbHtml(src, emoji) {
  return `<div class="ph">${emoji}</div>` + (src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '');
}

function card(v) {
  const [tt, tc] = TIERS[v.tier]; const cb = v.comments_breakdown || {}; const s = v.stats;
  const emoji = NICHE_EMOJI[v.niche?.[0]] || '📦';
  const usChip = cb.usShare == null ? `<span class="chip">🇺🇸 US ?</span>` : `<span class="chip ${cb.usShare*100 >= D.settings.minUsPct ? 'b' : 'r'}">🇺🇸 ${pct(cb.usShare,0)} US</span>`;
  const comp = s.competitors;
  const satChip = `<span class="chip ${comp === 0 ? 'g' : comp <= D.settings.maxCopycats ? 'y' : 'r'}">${comp === 0 ? '🟢 Untapped' : comp <= D.settings.maxCopycats ? '🟡 ' + comp + ' competing' : '🔴 Saturated'}</span>`;
  const intent = cb.buyIntent;
  return `<article class="card ${v.tier==='banger'?'banger':''}">
    <div class="thumb">${thumbHtml(v.thumb, emoji)}
      <span class="plat ${v.platform}">${v.platform === 'instagram' ? '📸 Instagram' : '🎵 TikTok'}</span>
      <span class="age">🕒 ${ago(s.hours)}</span>
      <div class="ring" style="--p:${v.score};--c:${tc}"><b>${v.score}</b></div>
    </div>
    <div class="cbody">
      <div class="tier" style="color:${tc}">${tt}</div>
      <div class="pname">${esc(v.product)}</div>
      <div class="sub">@${esc(v.handle)}${v.query ? ` · found via “${esc(v.query)}”` : ''}</div>
      ${v.fails.length ? `<div class="why">✗ ${v.fails.map(esc).join(' · ')}</div>` : ''}
      <div class="nums">
        <div class="num"><b>${fmt(v.views)}</b><span>views</span></div>
        <div class="num"><b>${fmt(v.likes)}</b><span>${pct(s.likeRate)} likes</span></div>
        <div class="num"><b>${fmt(v.comments)}</b><span>${pct(s.commentRate,2)} com.</span></div>
        <div class="num"><b>${fmt(s.viewsPerHour)}</b><span>views/hr</span></div>
      </div>
      <div class="sub">🛒 Buy intent <b style="color:var(--text)">${intent == null ? 'not read' : pct(intent,0)}</b>${cb.sampleSize ? ` <span style="color:var(--faint)">· ${cb.sampleSize} comments read</span>` : ''}</div>
      ${intent == null ? '' : `<div class="bar"><i style="width:${intent*100}%;background:var(--good)"></i><i style="width:${(cb.hype||0)*100}%;background:var(--blue)"></i><i style="width:${(cb.redFlag||0)*100}%;background:var(--bad)"></i><i style="width:${(cb.bait||0)*100}%;background:#8a63ff"></i></div>`}
      <div class="chips">
        <span class="chip">${emoji} ${esc((v.niche||[]).join(' › ') || 'General')}</span>${usChip}${satChip}
        ${v.price ? `<span class="chip g">💰 ${pct(s.margin,0)} margin</span>` : ''}
        ${v.captionBait ? `<span class="chip y">“Comment ${esc(v.captionBait)}” bait</span>` : ''}
      </div>
      <div class="cacts">
        <a class="btn sm" href="${esc(v.url)}" target="_blank" rel="noopener">▶ Watch</a>
        <button class="btn sm" data-open="${esc(v.id)}">Details</button>
        <button class="btn sm star ${saved[v.id]?'on':''}" data-star="${esc(v.id)}" style="flex:0 0 auto">${saved[v.id]?'★':'☆'}</button>
      </div>
    </div>
  </article>`;
}

function renderAds() {
  $('#hint').innerHTML = `Product ads that <b>started in the last ${D.settings?.maxAgeDays ?? 7} days</b> in the US (Facebook + Instagram), from the Meta Ad Library. Stores running several ads at once are scaling. Showing <b>${D.ads.length}</b>.`;
  $('#grid').innerHTML = D.ads.length ? D.ads.map(a => {
    const days = Math.max(0, Math.round((Date.now() - new Date(a.startedAt)) / 864e5));
    return `<article class="card">
      <div class="thumb">${thumbHtml(a.thumb, '📢')}<span class="plat" style="background:#1877f2">📢 Ad</span><span class="age">Running ${days}d</span></div>
      <div class="cbody">
        <div class="pname" style="padding-right:0">${esc(a.product || a.title || 'Product ad')}</div>
        <div class="sub">by <b style="color:var(--text)">${esc(a.pageName)}</b></div>
        <div class="chips">
          <span class="chip ${a.pageAdCount >= 3 ? 'g' : ''}">${a.pageAdCount} ad${a.pageAdCount>1?'s':''} from this store</span>
          ${(a.platforms||[]).map(p => `<span class="chip">${esc(p.toLowerCase())}</span>`).join('')}
        </div>
        ${a.text ? `<div class="sub" style="color:#cdd3e0">${esc(a.text.slice(0, 180))}${a.text.length > 180 ? '…' : ''}</div>` : ''}
        <div class="cacts">
          ${a.adUrl ? `<a class="btn sm" href="${esc(a.adUrl)}" target="_blank" rel="noopener">▶ See ad</a>` : ''}
          ${a.linkUrl ? `<a class="btn sm" href="${esc(a.linkUrl)}" target="_blank" rel="noopener">🛒 Their store</a>` : ''}
        </div>
      </div></article>`;
  }).join('') : `<div class="empty"><b>No product ads yet</b>${D.settings?.sources?.facebookAds ? 'Run a scan to check the Meta Ad Library.' : 'Facebook ads are off. Turn them on in ⚙️ Settings.'}</div>`;
}

// ---------- details drawer ----------
function openDetails(id) {
  const v = D.videos.find(x => x.id === id) || saved[id]; if (!v) return;
  const [tt, tc] = TIERS[v.tier] || TIERS.out; const cb = v.comments_breakdown || {}; const s = v.stats || {};
  const q = encodeURIComponent(v.product || '');
  const ruleRow = r => `<div class="rule"><span>${r.ok === true ? '✅' : r.ok === false ? '❌' : '❔'} ${esc(r.label)}</span><span>${esc(r.value)}</span></div>`;
  const parts = Object.entries(v.parts || {}).map(([k, x]) => `<div><span>${PARTS[k]||k}</span><span class="pb"><i style="width:${Math.round(x*100)}%"></i></span><span>${Math.round(x*(D.weights[k]||0))}/${D.weights[k]||0}</span></div>`).join('');
  const ai = v.ai;
  $('#drawer').innerHTML = `
    <div class="dhead">
      <div class="ring" style="--p:${v.score};--c:${tc};box-shadow:none"><b>${v.score}</b></div>
      <div class="grow"><div class="tier" style="color:${tc}">${tt}</div><div style="font-weight:700;font-size:16px">${esc(v.product)}</div></div>
      <button class="icon-btn" data-closedrawer>✕</button>
    </div>
    <div class="dbody">
      <div class="links">
        <a class="btn sm primary" href="${esc(v.url)}" target="_blank" rel="noopener">▶ Watch the reel</a>
        <a class="btn sm" href="https://www.aliexpress.us/w/wholesale-${q}.html" target="_blank" rel="noopener">🔎 AliExpress</a>
        <a class="btn sm" href="https://www.amazon.com/s?k=${q}" target="_blank" rel="noopener">🔎 Amazon</a>
        <a class="btn sm" href="https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=US&q=${q}&search_type=keyword_unordered" target="_blank" rel="noopener">📢 Ad Library</a>
        <button class="btn sm star ${saved[v.id]?'on':''}" data-star="${esc(v.id)}">${saved[v.id]?'★ Saved':'☆ Save'}</button>
      </div>
      ${ai?.verdict ? `<div class="sec"><h4>🤖 Claude’s verdict</h4><div class="verdict">${esc(ai.verdict)}</div>${ai.risks && !/^none/i.test(ai.risks) ? `<div class="why" style="margin-top:8px">⚠️ ${esc(ai.risks)}</div>` : ''}</div>` : `<div class="sec"><h4>🤖 Claude</h4><div class="sub">Not deep-checked (only the top ${D.settings?.deepChecks ?? 15} reels per scan get comments read + a full breakdown).</div></div>`}
      <div class="sec"><h4>Rules</h4><div class="rules">${(v.rules||[]).map(ruleRow).join('')}</div></div>
      <div class="sec"><h4>Numbers</h4><div class="kv">
        <span>Platform</span><span>${v.platform === 'instagram' ? '📸 Instagram Reel' : '🎵 TikTok'} · @${esc(v.handle)}</span>
        <span>Posted</span><span>${new Date(v.postedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} (${ago(s.hours)})</span>
        <span>Views</span><span>${(v.views||0).toLocaleString()} · ${fmt(s.viewsPerHour)}/hr</span>
        <span>Likes</span><span>${(v.likes||0).toLocaleString()} (${pct(s.likeRate)})</span>
        <span>Comments</span><span>${(v.comments||0).toLocaleString()} (${pct(s.commentRate,2)} of views · ${pct(s.commentsPerLike,0)} of likes)</span>
        ${v.shares ? `<span>Shares</span><span>${v.shares.toLocaleString()}</span>` : ''}
        ${v.query ? `<span>Found via</span><span>“${esc(v.query)}”</span>` : ''}
      </div></div>
      <div class="sec"><h4>What the comments say</h4>
        ${cb.buyIntent == null ? '<div class="sub">Comments weren’t read for this reel.</div>' : `
        <div class="kv"><span>🛒 Want to buy</span><span>${pct(cb.buyIntent,0)}</span><span>❤️ Hype</span><span>${pct(cb.hype,0)}</span>
        <span>⚠️ Red flags</span><span>${pct(cb.redFlag,0)}</span><span>🎣 Bait</span><span>${pct(cb.bait,0)}</span>
        <span>🇺🇸 US</span><span>${cb.usShare == null ? '—' : pct(cb.usShare,0)}</span><span>Read</span><span>${cb.sampleSize} comments</span></div>
        ${(cb.quotes||[]).length ? `<div style="display:grid;gap:6px;margin-top:10px">${cb.quotes.map(x => `<div class="q">“${esc(x)}”</div>`).join('')}</div>` : ''}`}
      </div>
      <div class="sec"><h4>Who buys it</h4><div class="kv">
        <span>Niche</span><span>${esc((v.niche||[]).join(' › '))}</span>
        <span>Buyer</span><span>${esc(v.audience?.who)}</span>
        <span>Age / lean</span><span>${esc(v.audience?.age)} · ${esc(v.audience?.lean)}</span>
        <span>Why</span><span>${esc(v.audience?.why)}</span>
        <span>Season</span><span>${esc(v.seasonal)}</span>
        <span>Price</span><span>${v.price ? `Cost ~$${v.price.costLow}–${v.price.costHigh} → sell $${v.price.sell} · <b>${pct(s.margin,0)} margin</b> <span style="color:var(--faint)">(Claude estimate)</span>` : '—'}</span>
      </div></div>
      <div class="sec"><h4>How the ${v.score}% was scored</h4><div class="parts">${parts}</div></div>
      ${ai?.variants?.length ? `<div class="sec"><h4>✨ Variant ideas</h4><div style="display:grid;gap:7px">${ai.variants.map(x => `<div class="vi"><b>${esc(x.name)}</b><br><span>${esc(x.angle)}</span></div>`).join('')}</div></div>` : ''}
      ${ai ? `<div class="sec"><h4>🎬 Content kit</h4><div style="display:grid;gap:7px">
        ${(ai.hooks||[]).length ? `<div class="vi"><b>Hooks</b>${ai.hooks.map(h => `<div>• ${esc(h)}</div>`).join('')}</div>` : ''}
        ${ai.videoIdea ? `<div class="vi"><b>Video idea</b><div>${esc(ai.videoIdea)}</div></div>` : ''}
        ${ai.seedancePrompt ? `<div class="vi"><button class="copy" data-copy="${esc(ai.seedancePrompt)}">Copy</button><b>Seedance prompt</b><div class="mono">${esc(ai.seedancePrompt)}</div></div>` : ''}
        ${ai.imagePrompt ? `<div class="vi"><button class="copy" data-copy="${esc(ai.imagePrompt)}">Copy</button><b>Image prompt</b><div class="mono">${esc(ai.imagePrompt)}</div></div>` : ''}
      </div></div>` : ''}
      ${v.caption ? `<div class="sec"><h4>Caption</h4><div class="sub" style="color:#cdd3e0">${esc(v.caption)}</div></div>` : ''}
    </div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

// ---------- settings ----------
async function openSettings() {
  $('#settingsModal').classList.add('on');
  const r = await fetch('/api/settings').then(r => r.json());
  const S = r.settings;
  const sw = (id, on, title, sub) => `<div class="tog"><div>${title}<small>${sub}</small></div><label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></label></div>`;
  const f = (id, label, val, step = 1) => `<label class="f">${label}<input type="number" id="${id}" value="${val}" step="${step}"></label>`;
  $('#settingsBody').innerHTML = `
    <div><b>Where to look</b><div style="display:grid;gap:8px;margin-top:8px">
      ${sw('sIg', S.sources.instagram, '📸 Instagram Reels', 'Main source: keyword search for fresh reels')}
      ${sw('sFb', S.sources.facebookAds, '📢 Facebook + Instagram ads', 'New US product ads from the Meta Ad Library')}
      ${sw('sTt', S.sources.tiktok, '🎵 TikTok', 'Optional, small sample')}
    </div></div>
    <div><b>Rules a reel must pass</b><div class="fgrid" style="margin-top:8px">
      ${f('sAge','Posted within (days)',S.maxAgeDays)}${f('sViews','Min views',S.minViews,1000)}${f('sCom','Min comments',S.minComments,10)}
      ${f('sLike','Min like rate %',S.minLikeRatePct,0.1)}${f('sUs','Min US audience %',S.minUsPct,5)}${f('sSat','Max competitors',S.maxCopycats)}
    </div></div>
    <div><b>Instagram search keywords</b> <span class="cost">one per line: hook phrases, “___ this is for you”, niches</span>
      <textarea id="sKw" rows="9" style="margin-top:8px">${esc(S.keywords.join('\n'))}</textarea></div>
    <div><b>Ad search words</b> <span class="cost">one per line (short words work best)</span>
      <textarea id="sAdKw" rows="3" style="margin-top:8px">${esc(S.adKeywords.join('\n'))}</textarea></div>
    <div><b>How much to pull</b><div class="fgrid" style="margin-top:8px">
      ${f('sPer','Reels per keyword',S.perKeyword)}${f('sDeep','Deep checks (comments + Claude)',S.deepChecks)}${f('sAds','Ads per word',S.adsPerKeyword)}
      ${f('sTtK','TikTok keywords',S.tiktokKeywords)}${f('sTtP','TikToks per keyword',S.tiktokPerKeyword)}${f('sEvery','Auto-scan every (hours)',S.scanEveryHours)}
    </div><div class="cost" id="costEst" style="margin-top:8px"></div></div>
    ${r.pinRequired ? `<label class="f">Admin PIN<input type="password" id="sPin" value="${esc(pin)}"></label>` : `<div class="cost">💡 Tip: add an <b>ADMIN_PIN</b> variable in Railway so only you can change settings or start scans.</div>`}
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="sReset">Reset to defaults</button><button class="btn primary" id="sSave">Save settings</button>
    </div>`;
  const est = () => {
    const kw = $('#sKw').value.split('\n').filter(x => x.trim()).length, ak = $('#sAdKw').value.split('\n').filter(x => x.trim()).length;
    const ig = $('#sIg').checked ? kw * +$('#sPer').value * 0.0015 : 0;
    const ads = $('#sFb').checked ? ak * +$('#sAds').value * 0.0058 : 0;
    const deep = +$('#sDeep').value * 30 * 0.0026;
    const tt = $('#sTt').checked ? +$('#sTtK').value * +$('#sTtP').value * 0.008 : 0;
    $('#costEst').innerHTML = `💵 Max Apify cost per scan ≈ <b>$${(ig + ads + deep + tt).toFixed(2)}</b> (Instagram only charges for reels that match your rules, so it’s usually less). Plus a few cents of Claude.`;
  };
  $('#settingsBody').addEventListener('input', est); est();
  $('#sReset').onclick = () => { save(r.defaults); };
  $('#sSave').onclick = () => save({
    sources: { instagram: $('#sIg').checked, facebookAds: $('#sFb').checked, tiktok: $('#sTt').checked },
    maxAgeDays: +$('#sAge').value, minViews: +$('#sViews').value, minComments: +$('#sCom').value, minLikeRatePct: +$('#sLike').value,
    minUsPct: +$('#sUs').value, maxCopycats: +$('#sSat').value,
    keywords: $('#sKw').value.split('\n'), adKeywords: $('#sAdKw').value.split('\n'),
    perKeyword: +$('#sPer').value, deepChecks: +$('#sDeep').value, adsPerKeyword: +$('#sAds').value,
    tiktokKeywords: +$('#sTtK').value, tiktokPerKeyword: +$('#sTtP').value, scanEveryHours: +$('#sEvery').value
  });
  async function save(settings) {
    if ($('#sPin')) { pin = $('#sPin').value; store.set('br_pin', pin); }
    const res = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ settings, pin }) }).then(r => r.json());
    if (!res.ok) return toast(res.message || 'Could not save');
    toast('✅ Settings saved. Rules apply now; new keywords apply on the next scan.');
    $('#settingsModal').classList.remove('on'); load();
  }
}

// ---------- events ----------
document.addEventListener('click', async e => {
  const t = e.target;
  const tab = t.closest('[data-v]'); if (tab) { view = tab.dataset.v; render(); return; }
  const op = t.closest('[data-open]'); if (op) { openDetails(op.dataset.open); return; }
  const st = t.closest('[data-star]'); if (st) {
    const id = st.dataset.star, v = D.videos.find(x => x.id === id) || saved[id];
    if (saved[id]) delete saved[id]; else if (v) saved[id] = v;
    store.set('br_saved', saved); render();
    if ($('#drawer').classList.contains('on')) openDetails(id);
    toast(saved[id] ? '⭐ Saved' : 'Removed from saved'); return;
  }
  const cp = t.closest('[data-copy]'); if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('📋 Copied')); return; }
  if (t.closest('[data-closedrawer]') || t === $('#scrim')) return closeDrawer();
  if (t.closest('[data-close]') || t === $('#settingsModal')) return $('#settingsModal').classList.remove('on');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); $('#settingsModal').classList.remove('on'); } });
['#q', '#fPlat', '#fNiche', '#fAge', '#fSort'].forEach(s => $(s).addEventListener('input', render));
$('#settingsBtn').onclick = openSettings;
$('#scanBtn').onclick = async () => {
  if (D.status.pinRequired && !pin) { pin = prompt('Admin PIN') || ''; store.set('br_pin', pin); }
  $('#scanBtn').disabled = true;
  const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) }).then(r => r.json()).catch(() => ({ message: 'Could not start the scan' }));
  toast(r.message || (r.ok ? 'Scan started' : 'Could not start'));
  if (!r.ok && /PIN/.test(r.message || '')) { pin = ''; store.set('br_pin', ''); }
  load();
};
load();
</script>
</body>
</html>
